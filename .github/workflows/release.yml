name: Release

# A tag starting with v builds the VPK and the nguidle-prep program for every system,
# then drafts a pre-release with their SHA-256. Run by hand to build them as artifacts only.

"on":
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  vpk:
    name: VPK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: vitasdk/vitasdk@sha256:579c6e00c5142fb59c980b6476f6120da54ee1ac832e973e60a43579153d4d4b
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rustup
        run: |
          installer="$RUNNER_TEMP/rustup-init"
          curl --fail --silent --show-error --location --output "$installer" \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
          printf "%s  %s\n" 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c "$installer" | sha256sum --check
          chmod +x "$installer"
          "$installer" -y --default-toolchain 1.100.0 --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build the VPK
        run: |
          # The runner owns the mounted checkout. Trust only these two Git worktrees.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          export GIT_CONFIG_KEY_1=safe.directory
          export GIT_CONFIG_VALUE_1="$GITHUB_WORKSPACE/engine"
          bash tools/engine.sh
          bash setup-tools.sh --build-only
          source tools/environment.sh
          NGU_VITA_BUILD_DIR="$NGU_BUILD/vita/release" bash build.sh
          mkdir dist
          cp "$NGU_BUILD/vita/release/nguidle.vpk" dist/nguidle.vpk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-vpk
          path: dist/*

  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch the pinned engine
        run: bash tools/engine.sh
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build
        run: cargo +1.100.0 build --release --locked --manifest-path engine/Cargo.toml -p ngu-app --bin nguidle-prep
      - name: Name the file
        run: |
          mkdir dist
          cp engine/target/release/nguidle-prep.exe dist/nguidle-prep-windows.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-windows
          path: dist/*

  linux:
    name: Linux
    # The oldest runner keeps the binary usable on older distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Fetch the pinned engine
        run: bash tools/engine.sh
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build
        run: cargo +1.100.0 build --release --locked --manifest-path engine/Cargo.toml -p ngu-app --bin nguidle-prep
      - name: Name the binary
        run: |
          mkdir dist
          cp engine/target/release/nguidle-prep dist/nguidle-prep-linux
          chmod +x dist/nguidle-prep-linux
      - name: Make the AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/nguidle-prep-linux AppDir/usr/bin/nguidle-prep
          cp engine/assets/ui/cat.png AppDir/nguidle-prep.png
          ln -s usr/bin/nguidle-prep AppDir/AppRun
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=nguidle-prep' \
            'Exec=nguidle-prep' 'Icon=nguidle-prep' 'Categories=Utility;' > AppDir/nguidle-prep.desktop
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/nguidle-prep-linux-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-linux
          path: dist/*

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch the pinned engine
        run: bash tools/engine.sh
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --target x86_64-apple-darwin --target aarch64-apple-darwin
      - name: Build both processors
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo +1.100.0 build --release --locked --manifest-path engine/Cargo.toml --target "$target" -p ngu-app --bin nguidle-prep
          done
      - name: Join them into one universal binary
        run: |
          mkdir dist
          lipo -create -output dist/nguidle-prep-macos \
            engine/target/x86_64-apple-darwin/release/nguidle-prep \
            engine/target/aarch64-apple-darwin/release/nguidle-prep
          chmod +x dist/nguidle-prep-macos
      - name: Make the app bundle
        run: |
          app=nguidle-prep.app
          mkdir -p "$app/Contents/MacOS"
          cp dist/nguidle-prep-macos "$app/Contents/MacOS/nguidle-prep"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleName</key><string>nguidle-prep</string>' \
            '<key>CFBundleExecutable</key><string>nguidle-prep</string>' \
            '<key>CFBundleIdentifier</key><string>io.github.vallfrr.nguidleprep</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '</dict></plist>' > "$app/Contents/Info.plist"
          ditto -c -k --keepParent "$app" dist/nguidle-prep-macos-app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files-macos
          path: dist/*

  draft:
    name: Draft the pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vpk, windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: files-*
          path: dist
          merge-multiple: true
      - name: Write the notes
        run: |
          {
            echo "You need to own NGU Idle on Steam (version 1.260)."
            echo
            echo "Source tag: ${GITHUB_REF_NAME}"
            echo
            echo "SHA-256"
            echo
            echo '```'
            (cd dist && sha256sum * )
            echo '```'
          } > notes.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --draft --prerelease --title "${GITHUB_REF_NAME}" --notes-file notes.md
