name: Checks

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGU_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  vita:
    name: Vita host
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: vitasdk/vitasdk@sha256:579c6e00c5142fb59c980b6476f6120da54ee1ac832e973e60a43579153d4d4b
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Install Rustup
        run: |
          installer="$RUNNER_TEMP/rustup-init"
          curl --fail --silent --show-error --location --output "$installer" \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
          printf "%s  %s\n" 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c "$installer" | sha256sum --check
          chmod +x "$installer"
          "$installer" -y --default-toolchain 1.100.0 --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install check tools
        run: |
          python -m pip install ruff==0.11.13
          cargo +1.100.0 install --locked --version 1.43.0 just
      - name: Run the local checks
        run: just check
